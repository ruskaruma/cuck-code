name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install zsh and fish for the shell hook tests
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/cuck
      - name: Test the npm package's install logic
        if: runner.os == 'Linux'
        run: node --test packaging/npm/test/*.test.js

  mod:
    # The Claude Code mod's tests run inside Claude Code itself; no login needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin test packaging/claude-code
